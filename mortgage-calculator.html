<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 房贷利率优化策略 - FinanceHub</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2700554011244473" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8fafc; font-family: 'Inter', system-ui, sans-serif; }
        .nav-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        #article-wrapper { max-height: 800px; overflow: hidden; position: relative; transition: max-height 0.5s ease; }
        #article-wrapper.expanded { max-height: 5000px; }
        .read-more-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 200px; background: linear-gradient(transparent, white); pointer-events: none; }
        #article-wrapper.expanded .read-more-overlay { display: none; }
        table { font-size: 0.75rem; border-collapse: collapse; width: 100%; }
        table td, table th { padding: 10px; border: 1px solid #eef2f6; }
    </style>
</head>
<body class="text-slate-800">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2 font-black text-2xl text-blue-600">
                <a href="/index.html"><span>FinanceHub</span><span class="text-slate-400">2026</span></a>
            </div>
            <div class="flex items-center space-x-6 text-sm font-bold">
                <a href="/index.html" class="pb-1 hover:text-blue-600 transition">汇率转换</a>
                <a href="/tax-calculator.html" class="pb-1 hover:text-blue-600 transition">个税计算</a>
                <a href="/mortgage-calculator.html" class="nav-active pb-1">房贷计算</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-10 grid lg:grid-cols-12 gap-10">
        <div class="lg:col-span-5">
            <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 sticky top-24">
                <h2 class="text-xl font-black mb-6 italic">房贷月供试算</h2>
                <div class="space-y-4">
                    <input type="number" id="mAmount" placeholder="贷款总额(万)" class="w-full p-4 bg-slate-50 border rounded-2xl">
                    <input type="number" id="mYear" placeholder="年限(如 30)" class="w-full p-4 bg-slate-50 border rounded-2xl">
                    <input type="number" id="mRate" placeholder="年利率%(如 3.2)" class="w-full p-4 bg-slate-50 border rounded-2xl">
                    <button onclick="calculateM()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg transition">开始计算</button>
                    <div id="mResult" class="hidden mt-4 p-4 bg-orange-50 text-orange-700 rounded-xl"></div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7">
            <div class="bg-white p-10 rounded-3xl shadow-sm border border-slate-100 relative">
                <div id="article-wrapper">
                    <article class="prose max-w-none text-sm text-slate-600">
                        <h1 class="text-2xl font-black text-slate-900 mb-6">2026 房贷利率市场化全解析：优化家庭资产负债表</h1>
                        
                        <p class="mb-6 font-bold text-blue-600">从 2026 年 1 月 1 日起，全国存量房贷实现商贷与公积金“双降”。</p>

                        <h2 class="font-bold text-slate-800 mb-4 font-mono">01 利率调整示例</h2>
                        <table>
                            <thead class="bg-slate-50"><tr><th>加点类型</th><th>调整前</th><th>2026调整后</th><th>月供减少(百万贷款)</th></tr></thead>
                            <tbody>
                                <tr><td>LPR-45BP</td><td>3.15%</td><td>3.05%</td><td>约 59 元</td></tr>
                                <tr><td>LPR-30BP</td><td>3.30%</td><td>3.20%</td><td>约 95 元</td></tr>
                            </tbody>
                        </table>

                        <h2 class="font-bold text-slate-800 mt-8 mb-4 font-mono">02 商转公策略</h2>
                        <p>5 年以上首套个人公积金贷款利率调整为 2.6%。通过“顺位抵押”无需自筹垫资即可冲还原商贷。</p>
                    </article>
                    <div class="read-more-overlay"></div>
                </div>
                <div class="text-center mt-6">
                    <button onclick="expandArticle()" id="read-more-btn" class="bg-blue-600 text-white px-10 py-3 rounded-full font-bold shadow-lg hover:bg-blue-700 transition">阅读全文</button>
                </div>
            </div>
        </div>
    </main>
    <script>
        function calculateM() {
            const m = document.getElementById('mAmount').value * 10000;
            const y = document.getElementById('mYear').value * 12;
            const r = document.getElementById('mRate').value / 100 / 12;
            const res = (m * r * Math.pow(1 + r, y)) / (Math.pow(1 + r, y) - 1);
            document.getElementById('mResult').innerHTML = `<div class='font-bold'>月供: ¥${res.toFixed(2)}</div>`;
            document.getElementById('mResult').classList.remove('hidden');
        }
        function expandArticle() { document.getElementById('article-wrapper').classList.add('expanded'); document.getElementById('read-more-btn').style.display = 'none'; }
    </script>
</body>
</html>
